name: Build Mystic Menu

'on':
push:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build mod
    run: ./gradlew build

  - uses: actions/upload-artifact@v4
    with:
      name: Mystic-Menu
      path: build/libs/*.jar
      if-no-files-found: error
